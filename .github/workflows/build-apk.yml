name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: KAI-CASINO-X
  VERSION: 2.3.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KAI-CASINO-X-v${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KAI-CASINO-X-v2.3.0-APK
          path: KAI-CASINO-X-v2.3.0.apk
          retention-days: 30

      - name: Publish v2.3.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: KAI CASINO X v2.3.0
          prerelease: false
          make_latest: true
          files: KAI-CASINO-X-v2.3.0.apk
          body: |
            KAI CASINO X v2.3.0 interactive gameplay release.
            Adds stateful slot paylines, roulette bet selection, blackjack Hit/Stand/Double, baccarat third-card rules, Sic Bo selections, and live Crash cash-out rounds.
            Preserves the polished v2.2 lobby, persistent KAI Coins, XP, missions, VIP and settings.
            Virtual credits only. No deposits, withdrawals, cash-out, cryptocurrency, or real-money wagering.
